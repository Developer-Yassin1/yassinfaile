<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yassin_Vip-File — منصة خاصة</title>
<link rel="icon" href="https://cdn.imagetourls.com/uploads/tyImg/asb9XJFJ.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-0:#030503;--bg-1:#070c07;--bg-2:#0b130b;
    --panel:#0c140c;--panel-2:#101a10;
    --line:#1a281a;--line-2:#243624;
    --neon:#3bff86;--neon-dim:#1c7e42;--neon-glow:rgba(59,255,134,.35);
    --blue:#2b8fff;--blue-dim:#1551a0;
    --gold:#d4af37;--gold-dim:#8a7020;
    --danger:#ff4d6d;--danger-dim:#5c1a2a;
    --orange:#ff9f43;
    --text:#eef7ef;--muted:#7d957f;--muted-2:#5c6f5e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Cairo',system-ui,-apple-system,sans-serif;
    background:var(--bg-0);color:var(--text);
    min-height:100vh;overflow-x:hidden;
    font-weight:400;letter-spacing:.1px;position:relative;
  }
  a{color:var(--neon);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit;transition:.2s}
  input,textarea,select{font-family:inherit;outline:none;border:none;background:none;color:inherit}
  input:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
  ::selection{background:var(--neon);color:var(--bg-0)}

  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1000px 500px at 85% -10%, rgba(59,255,134,.08) 0%, transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(43,143,255,.05) 0%, transparent 55%),
      radial-gradient(1400px 700px at 50% 50%, rgba(11,19,11,.6) 0%, transparent 70%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(59,255,134,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,255,134,.02) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse at 50% 30%, #000 0%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%, #000 0%, transparent 80%);
  }

  .app-shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:12px 22px;
    background:rgba(7,12,7,.85);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
  }
  .topbar .logo{
    width:38px;height:38px;border-radius:10px;object-fit:cover;
    border:1px solid var(--line-2);
    box-shadow:0 0 0 1px rgba(59,255,134,.15), 0 0 18px rgba(59,255,134,.12);
    flex-shrink:0;
  }
  .topbar .title{
    font-family:'Reem Kufi',sans-serif;
    font-size:17px;font-weight:700;
    background:linear-gradient(120deg, #eef7ef 0%, var(--neon) 60%, var(--gold) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.5px;
  }
  .topbar .title small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:2px;margin-top:1px;-webkit-text-fill-color:var(--muted)}
  .topbar .spacer{flex:1}
  .topbar .me-info{display:flex;align-items:center;gap:10px}
  .topbar .me-info .who{text-align:left;line-height:1.2}
  .topbar .me-info .who b{font-size:13px;font-weight:700}
  .topbar .me-info .who span{display:block;font-size:10.5px;color:var(--muted)}
  .topbar .me-info .av{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg, var(--neon-dim), var(--neon));
    display:grid;place-items:center;color:var(--bg-0);font-weight:900;font-size:14px;
    border:1.5px solid var(--line-2);
    box-shadow:0 0 0 2px rgba(59,255,134,.1);
    position:relative;
  }
  .topbar .me-info .av .dot{
    position:absolute;bottom:-1px;left:-1px;
    width:11px;height:11px;border-radius:50%;
    background:var(--muted-2);border:2px solid var(--bg-1);
  }
  .topbar .me-info .av .dot.online{background:var(--neon);box-shadow:0 0 8px var(--neon-glow)}
  .topbar .logout{
    padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;
    color:var(--danger);border:1px solid var(--danger-dim);
    background:rgba(255,77,109,.05);
  }
  .topbar .logout:hover{background:rgba(255,77,109,.12);border-color:var(--danger)}

  .role-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.3px;
    background:rgba(125,149,127,.1);color:var(--muted);border:1px solid var(--line-2);
  }
  .role-badge.owner{background:rgba(212,175,55,.1);color:var(--gold);border-color:var(--gold-dim)}
  .role-badge.admin{background:rgba(255,77,109,.08);color:var(--danger);border-color:var(--danger-dim)}
  .role-badge.dev  {background:rgba(59,255,134,.08);color:var(--neon);border-color:var(--neon-dim)}

  .layout{
    flex:1;display:grid;grid-template-columns:1fr;
    gap:0;max-width:1500px;width:100%;margin:0 auto;
  }
  @media(min-width:960px){ .layout{grid-template-columns:260px 1fr;gap:22px;padding:22px} }

  .sidebar{
    background:rgba(7,12,7,.6);
    border-bottom:1px solid var(--line);
    padding:14px;overflow-x:auto;
  }
  @media(min-width:960px){
    .sidebar{
      background:linear-gradient(180deg, rgba(12,20,12,.7), rgba(7,12,7,.7));
      border:1px solid var(--line);
      border-radius:14px;padding:16px;
      height:fit-content;position:sticky;top:82px;
      overflow-x:visible;
    }
  }
  .sidebar h3{
    font-size:10.5px;color:var(--muted-2);letter-spacing:2.5px;font-weight:700;
    text-transform:uppercase;margin-bottom:12px;padding:0 8px;
  }
  .sidebar nav{display:flex;gap:6px;flex-wrap:nowrap}
  @media(min-width:960px){ .sidebar nav{flex-direction:column;gap:4px} }
  .sidebar nav button{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:10px;
    color:var(--muted);font-weight:600;font-size:13.5px;
    white-space:nowrap;flex-shrink:0;
    border:1px solid transparent;position:relative;
  }
  .sidebar nav button:hover{color:var(--text);background:rgba(59,255,134,.04)}
  .sidebar nav button.active{
    color:var(--neon);
    background:linear-gradient(90deg, rgba(59,255,134,.12), transparent 90%);
    border-color:var(--line-2);
    box-shadow:inset 2px 0 0 var(--neon);
  }
  .sidebar nav button .ic{font-size:15px;width:18px;text-align:center}
  .sidebar nav button .cnt{
    position:absolute;left:6px;top:6px;
    background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;
    padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;
  }

  .main{padding:18px}
  @media(min-width:960px){ .main{padding:0} }
  .page{
    background:linear-gradient(180deg, rgba(12,20,12,.7), rgba(7,12,7,.7));
    border:1px solid var(--line);border-radius:14px;
    padding:22px;min-height:520px;
    animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .page-head h2{
    font-family:'Reem Kufi',sans-serif;
    font-size:20px;font-weight:700;letter-spacing:.3px;
    display:flex;align-items:center;gap:10px;
  }
  .page-head p{font-size:12.5px;color:var(--muted);margin-top:4px;width:100%}
  .page-head .actions{margin-right:auto;display:flex;gap:8px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:10px;
    font-weight:800;font-size:13.5px;letter-spacing:.3px;
    background:linear-gradient(135deg, var(--neon), #2fd173);
    color:var(--bg-0);
    box-shadow:0 4px 16px rgba(59,255,134,.2), 0 0 0 1px rgba(59,255,134,.3);
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(59,255,134,.32)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;color:var(--neon);border:1px solid var(--neon-dim);box-shadow:none}
  .btn.ghost:hover{background:rgba(59,255,134,.08)}
  .btn.blue{
    background:linear-gradient(135deg, var(--blue), #1566d6);
    color:#fff;box-shadow:0 4px 16px rgba(43,143,255,.3);
  }
  .btn.blue:hover{box-shadow:0 6px 24px rgba(43,143,255,.5)}
  .btn.danger{background:linear-gradient(135deg, #ff4d6d, #e63a5a);color:#fff}
  .btn.warn{background:linear-gradient(135deg, #ff9f43, #e88a2f);color:#1a0e00}
  .btn.small{padding:7px 12px;font-size:12px;border-radius:8px}
  .btn.full{width:100%}
  .btn.lg{padding:14px 28px;font-size:15px;border-radius:12px}

  .field{margin-bottom:14px}
  .field label{
    display:block;font-size:11.5px;color:var(--muted);
    margin-bottom:7px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;
  }
  .field input,.field select,.field textarea{
    width:100%;padding:13px 15px;
    background:rgba(3,5,3,.7);color:var(--text);
    border:1px solid var(--line-2);border-radius:10px;
    font-size:14px;transition:.2s;
  }
  .field textarea{resize:vertical;min-height:80px;line-height:1.6}
  .field input::placeholder,.field textarea::placeholder{color:var(--muted-2)}
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--neon-dim);
    box-shadow:0 0 0 3px rgba(59,255,134,.08);
    background:rgba(3,5,3,.9);
  }
  .field.admin-code{
    padding:13px;border-radius:11px;
    background:linear-gradient(180deg, rgba(212,175,55,.06), rgba(212,175,55,.01));
    border:1px solid var(--gold-dim);
  }
  .field.admin-code label{color:var(--gold)}
  .field.admin-code input{border-color:rgba(212,175,55,.3)}
  .field.admin-code input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.1)}
  .field.admin-code small{display:block;color:var(--muted);font-size:11px;margin-top:7px;line-height:1.5}

  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row.center{justify-content:center}

  .filter-bar{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;
    padding:12px;background:rgba(3,5,3,.4);
    border:1px solid var(--line);border-radius:12px;
    align-items:center;
  }
  .filter-bar .search{flex:1;min-width:200px;position:relative}
  .filter-bar .search input{
    width:100%;padding:10px 40px 10px 14px;
    background:rgba(0,0,0,.3);color:var(--text);
    border:1px solid var(--line-2);border-radius:9px;font-size:13px;
  }
  .filter-bar .search input:focus{border-color:var(--neon-dim)}
  .filter-bar .search::before{
    content:"🔍";position:absolute;right:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.5;
  }
  .chip{
    padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;
    background:rgba(3,5,3,.6);color:var(--muted);
    border:1px solid var(--line-2);cursor:pointer;
  }
  .chip:hover{color:var(--text)}
  .chip.active{
    background:linear-gradient(135deg, var(--neon), #2fd173);
    color:var(--bg-0);border-color:transparent;
  }

  .products-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }
  .product-card{
    background:linear-gradient(180deg, rgba(16,26,16,.6), rgba(10,16,10,.6));
    border:1px solid var(--line);border-radius:14px;
    overflow:hidden;transition:.2s;
    display:flex;flex-direction:column;
  }
  .product-card:hover{
    border-color:var(--line-2);
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.4), 0 0 0 1px rgba(59,255,134,.08);
  }
  .product-card .cover{
    aspect-ratio:16/10;
    background:linear-gradient(135deg, #0c140c, #16241a);
    display:grid;place-items:center;
    position:relative;overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .product-card .cover img{width:100%;height:100%;object-fit:cover}
  .product-card .cover .placeholder{font-size:42px;opacity:.3}
  .product-card .cover .cat-tag{
    position:absolute;top:10px;right:10px;
    background:rgba(0,0,0,.7);color:var(--neon);
    padding:3px 9px;border-radius:8px;font-size:10.5px;font-weight:700;
    border:1px solid var(--neon-dim);
    backdrop-filter:blur(6px);
  }
  .product-card .cover .access-badge{
    position:absolute;top:10px;left:10px;
    padding:3px 9px;border-radius:8px;font-size:10.5px;font-weight:700;
    backdrop-filter:blur(6px);
  }
  .access-badge.free{background:rgba(59,255,134,.2);color:var(--neon);border:1px solid var(--neon-dim)}
  .access-badge.code{background:rgba(43,143,255,.2);color:var(--blue);border:1px solid var(--blue-dim)}
  .access-badge.paid{background:rgba(212,175,55,.2);color:var(--gold);border:1px solid var(--gold-dim)}
  .product-card .body{padding:12px 14px;flex:1;display:flex;flex-direction:column}
  .product-card .body h4{
    font-size:14.5px;font-weight:700;margin-bottom:6px;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .product-card .body .desc{
    font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .product-card .body .price-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .price-tag{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:700;
    background:rgba(212,175,55,.1);color:var(--gold);
    border:1px solid var(--gold-dim);
  }
  .price-tag.free{background:rgba(59,255,134,.1);color:var(--neon);border-color:var(--neon-dim)}
  .product-card .meta-row{
    display:flex;gap:8px;align-items:center;
    font-size:10.5px;color:var(--muted-2);
    margin-bottom:10px;
  }
  .product-card .meta-row .mini-av{
    width:18px;height:18px;border-radius:50%;
    background:linear-gradient(135deg, var(--neon-dim), var(--neon));
    display:grid;place-items:center;color:var(--bg-0);
    font-weight:900;font-size:9px;
  }
  .product-card .get-btn{
    margin-top:auto;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:11px;border-radius:10px;
    background:linear-gradient(135deg, var(--blue), #1566d6);
    color:#fff;font-weight:800;font-size:13.5px;
    box-shadow:0 4px 14px rgba(43,143,255,.25);
    cursor:pointer;transition:.2s;
  }
  .product-card .get-btn:hover{
    box-shadow:0 6px 20px rgba(43,143,255,.4);
    transform:translateY(-1px);
  }
  .product-card .get-btn.owned{background:linear-gradient(135deg, #1a5a2e, #2fd173)}
  .product-card .get-btn.pending{background:linear-gradient(135deg, #6d5a1a, #d4af37);color:#1a0e00}

  .product-modal{
    position:fixed;inset:0;z-index:180;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:none;place-items:center;padding:20px;
    overflow-y:auto;
  }
  .product-modal.open{display:grid;animation:fadeUp .25s ease both}
  .product-view{
    width:min(640px,96vw);
    background:linear-gradient(180deg, #0c140c, #070c07);
    border:1px solid var(--line-2);border-radius:18px;
    overflow:hidden;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.8);
  }
  .product-view .close-x{
    position:absolute;top:14px;left:14px;z-index:5;
    width:34px;height:34px;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;
    display:grid;place-items:center;font-size:18px;
    backdrop-filter:blur(6px);
  }
  .product-view .close-x:hover{background:var(--danger)}
  .product-view .hero{
    aspect-ratio:16/9;background:#0a120a;
    position:relative;overflow:hidden;
    display:grid;place-items:center;
    border-bottom:1px solid var(--line);
  }
  .product-view .hero img{width:100%;height:100%;object-fit:cover}
  .product-view .hero .ph{font-size:64px;opacity:.3}
  .product-view .hero .hero-badges{position:absolute;top:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap}
  .product-view .body{padding:22px}
  .product-view .body h3{font-size:20px;font-weight:800;margin-bottom:8px;line-height:1.4}
  .product-view .body .cat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:11.5px;color:var(--muted);align-items:center}
  .product-view .body .long-desc{
    font-size:13.5px;line-height:1.8;color:#d8e9da;
    white-space:pre-wrap;word-break:break-word;
    padding:14px;background:rgba(3,5,3,.4);
    border:1px solid var(--line);border-radius:10px;
    margin-bottom:16px;
  }
  .product-view .body .prices-block{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .product-view .body .prices-block .price-tag{padding:8px 14px;font-size:13px}
  .product-view .action-area{
    padding:16px;border-radius:12px;
    background:rgba(3,5,3,.5);border:1px solid var(--line);
    margin-top:6px;
  }
  .code-entry{display:flex;gap:8px;margin-bottom:10px}
  .code-entry input{
    flex:1;padding:12px 14px;
    background:rgba(0,0,0,.4);color:var(--text);
    border:1px solid var(--line-2);border-radius:10px;
    font-size:14px;font-family:'Courier New', monospace;
    letter-spacing:1px;
  }
  .code-entry input:focus{border-color:var(--neon-dim)}
  .unlocked-content{
    margin-top:12px;padding:14px;
    background:rgba(59,255,134,.05);
    border:1px solid var(--neon-dim);border-radius:10px;
    animation:fadeUp .3s ease both;
  }
  .unlocked-content .lbl{
    font-size:11.5px;color:var(--neon);font-weight:700;
    letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;
  }
  .video-embed{
    position:relative;width:100%;padding-bottom:56.25%;
    border-radius:10px;overflow:hidden;
    background:#000;border:1px solid var(--line-2);
  }
  .video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  .order-card{
    background:linear-gradient(180deg, rgba(16,26,16,.5), rgba(10,16,10,.5));
    border:1px solid var(--line);border-radius:12px;
    padding:14px;display:flex;gap:12px;align-items:flex-start;
    flex-wrap:wrap;
  }
  .order-card:hover{border-color:var(--line-2)}
  .order-card .o-info{flex:1;min-width:220px}
  .order-card .o-info .o-num{font-size:11.5px;color:var(--muted-2);letter-spacing:1px;font-family:'Courier New', monospace}
  .order-card .o-info h4{font-size:14.5px;font-weight:700;margin:4px 0 6px}
  .order-card .o-info .o-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .order-card .o-info .o-meta span{display:inline-flex;align-items:center;gap:4px}
  .order-card .o-price{font-size:15px;font-weight:800;color:var(--gold)}
  .order-card .o-status{padding:3px 10px;border-radius:7px;font-size:11px;font-weight:800}
  .o-status.pending{background:rgba(255,159,67,.1);color:var(--orange);border:1px solid #6d4a1a}
  .o-status.partial{background:rgba(43,143,255,.1);color:var(--blue);border:1px solid var(--blue-dim)}
  .o-status.paid{background:rgba(59,255,134,.1);color:var(--neon);border:1px solid var(--neon-dim)}
  .o-status.rejected{background:rgba(255,77,109,.1);color:var(--danger);border:1px solid var(--danger-dim)}
  .order-card .o-actions{display:flex;gap:6px;flex-wrap:wrap;width:100%}

const fmtTime = ts => {
  if(!ts) return "";
  const d = new Date(ts), now = new Date(), diff = (now-d)/1000;
  if(diff<60) return "الآن";
  if(diff<3600) return Math.floor(diff/60)+" د";
  if(diff<86400) return Math.floor(diff/3600)+" س";
  if(diff<604800) return Math.floor(diff/86400)+" يوم";
  return d.toLocaleDateString("ar-EG");
};
const fmtDate = ts => {

async function uploadImage(file){
  const fd = new FormData();
  fd.append("image", file);
  const res = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_KEY, { method:"POST", body:fd });
  const j = await res.json();
  if(!j.success) throw new Error("ImgBB: " + (j.error?.message || "failed"));
  return { url: j.data.url, thumb: j.data.thumb?.url || j.data.url };
}
async function uploadFile(file){
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch("https://tmpfiles.org/api/v1/upload", { method:"POST", body:fd });
  const j = await res.json();
  if(!j.data?.url) throw new Error("Upload failed");
  const directUrl = j.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
  return { url: directUrl, name: file.name, size: file.size };
}

function renderCatChips(){
  const chips = document.getElementById("catChips");
  if(!chips) return;
  const cats = Object.entries(allCategories).sort((a,b) => (a[1].order||0) - (b[1].order||0));
  let html = `<button class="chip ${currentFilter.cat==="all"?"active":""}" onclick="filterCat('all')">الكل</button>`;
  cats.forEach(([id, cat]) => {
    html += `<button class="chip ${currentFilter.cat===id?"active":""}" onclick="filterCat('${id}')">${esc(cat.name)}</button>`;
  });
  chips.innerHTML = html;
}
window.filterCat = id => { currentFilter.cat = id; renderCatChips(); renderProductCards(); };
window.filterSearch = v => { currentFilter.search = v; renderProductCards(); };

function visibleProducts(){
  const now = Date.now();
  return Object.entries(allProducts)
    .map(([id, p]) => ({ id, ...p }))
    .filter(p => {
      if(p.deleted) return false;
      if(p.expiresAt && p.expiresAt < now) return false;
      if(currentFilter.cat !== "all" && p.categoryId !== currentFilter.cat) return false;
      if(currentFilter.search){
        const s = currentFilter.search.toLowerCase();
        if(!(p.name || "").toLowerCase().includes(s) && !(p.description || "").toLowerCase().includes(s)) return false;
      }
      if(!me.isOwner){
        const a = p.audience || { type:"all" };
        if(a.type === "all") return true;
        if(a.type === "role" && a.roles && a.roles.includes(me.role)) return true;
        if((a.type === "user" || a.type === "dev" || a.type === "specific") && a.uids && a.uids.includes(me.uid)) return true;
        return false;
      }
      return true;
    })
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
}

function renderProductCards(){
  const grid = document.getElementById("productsGrid");
  if(!grid) return;
  const items = visibleProducts();
  if(!items.length){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="big">📦</div>لا توجد منتجات متاحة</div>`;
    return;
  }
  grid.innerHTML = items.map(p => productCardHTML(p)).join("");
}

function productCardHTML(p){
  const access = p.access || { type: "open" };
  const cat = allCategories[p.categoryId];
  const cover = p.coverUrl ? `<img src="${esc(p.coverUrl)}" alt="" />` : `<div class="placeholder">${access.type==="open"?"🆓":access.type==="code"?"🔒":"💰"}</div>`;
  const badge = access.type === "open"
    ? `<span class="access-badge free">🆓 مفتوح</span>`
    : access.type === "code"
      ? `<span class="access-badge code">🔒 بكود</span>`
      : `<span class="access-badge paid">💰 مدفوع</span>`;
  const prices = (p.prices || []).map(pr => {
    const cur = CURRENCIES.find(c => c.code === pr.currency) || { symbol: pr.currency };
    return `<span class="price-tag">${pr.amount} ${cur.symbol}</span>`;
  }).join("");
  const isFree = access.type === "open";
  const priceHTML = isFree ? `<span class="price-tag free">🆓 مجاني</span>` : prices;

  const myOrder = Object.entries(allOrders).find(([_, o]) => o.productId === p.id && o.buyerUid === me.uid && (o.status === "paid" || o.status === "approved"));
  const pendingOrder = Object.entries(allOrders).find(([_, o]) => o.productId === p.id && o.buyerUid === me.uid && o.status === "pending");
  let btn = `<button class="get-btn" onclick="openProduct('${p.id}')">Get ↗</button>`;
  if(myOrder) btn = `<button class="get-btn owned" onclick="openProduct('${p.id}')">✅ مفتوح — اضغط للدخول</button>`;
  else if(pendingOrder) btn = `<button class="get-btn pending" onclick="openProduct('${p.id}')">⏳ قيد المراجعة</button>`;

  return `
    <div class="product-card">
      <div class="cover">
        ${cover}
        ${cat ? `<span class="cat-tag">${esc(cat.name)}</span>` : ""}
        ${badge}
      </div>
      <div class="body">
        <h4>${esc(p.name || "منتج")}</h4>
        ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ""}
        <div class="price-row">${priceHTML}</div>
        <div class="meta-row">
          <div class="mini-av">${esc(initial(p.from?.name))}</div>
          <span>${esc(p.from?.name || "؟")}</span>
          <span>·</span>
          <span>${fmtTime(p.createdAt)}</span>
        </div>
        ${btn}
      </div>
    </div>`;
}

window.openProduct = async id => {
  const p = allProducts[id];
  if(!p) return;
  const access = p.access || { type: "open" };
  const cat = allCategories[p.categoryId];

  const cover = p.coverUrl ? `<img src="${esc(p.coverUrl)}" alt="" />` : `<div class="ph">${access.type==="open"?"🆓":access.type==="code"?"🔒":"💰"}</div>`;
  const badge = access.type === "open"
    ? `<span class="access-badge free">🆓 مفتوح</span>`
    : access.type === "code"
      ? `<span class="access-badge code">🔒 بكود</span>`
      : `<span class="access-badge paid">💰 مدفوع</span>`;
  const prices = (p.prices || []).map(pr => {
    const cur = CURRENCIES.find(c => c.code === pr.currency) || { symbol: pr.currency };
    return `<span class="price-tag">${pr.amount} ${cur.symbol}</span>`;
  }).join("");

  const content = p.content || {};
  const myOrders = Object.entries(allOrders).filter(([_, o]) => o.productId === id && o.buyerUid === me.uid);

  let actionHTML = "";

    actionHTML = renderOpenContent(content);

    actionHTML = `

      ${access.purchaseCodeAllowed ? `<button class="btn blue full" style="margin-top:12px" onclick="requestPurchase('${id}')">💰 شراء الكود</button>` : ""}

    `;

    if(paidOrder){
      actionHTML = `
        <div style="padding:10px 12px;background:rgba(59,255,134,.08);border:1px solid var(--neon-dim);border-radius:10px;font-size:13px;color:var(--neon);font-weight:700;margin-bottom:10px">✅ تم تأكيد الدفع — ادخل الكود لفتح المنتج</div>
        <div class="code-entry">
          <input id="unlockCode" placeholder="ادخل الكود" />
          <button class="btn" onclick="tryUnlock('${id}')">فتح</button>
        </div>
        <div id="unlockResult"></div>
      `;
    } else if(partialOrder){
      actionHTML = `
        <div style="padding:12px;background:rgba(43,143,255,.08);border:1px solid var(--blue-dim);border-radius:10px;font-size:12.5px;color:var(--blue);margin-bottom:10px">
          💰 تم دفع جزء — المتبقي: <b>${partialOrder[1].remaining || "؟"} ${partialOrder[1].currency || ""}</b>
          <div style="margin-top:6px;color:var(--muted);font-size:11.5px">تابع مع المطوّر لإكمال الدفع.</div>

window.closeProduct = () => {
  document.getElementById("productModal").classList.remove("open");
};

function renderOpenContent(content){
  if(!content || !content.type) return `<div style="font-size:12px;color:var(--muted);text-align:center">— لا يوجد محتوى —</div>`;
  if(content.type === "link"){
    return `<a href="${esc(content.url)}" target="_blank" rel="noopener" class="btn blue full lg">🔗 فتح الرابط</a>`;
  }
  if(content.type === "file"){
    return `<a href="${esc(content.url)}" target="_blank" rel="noopener" class="btn blue full lg">📎 تحميل الملف${content.fileName ? " — "+esc(content.fileName) : ""}</a>`;
  }
  if(content.type === "video"){
    const yt = youtubeEmbed(content.url);
    const tt = tiktokEmbed(content.url);
    const embed = yt || tt;
    if(embed){
      return `<div class="video-embed"><iframe src="${embed}" allowfullscreen></iframe></div>`;
    }
    return `<a href="${esc(content.url)}" target="_blank" rel="noopener" class="btn blue full lg">🎬 مشاهدة الفيديو</a>`;
  }
  return "";
}

window.tryUnlock = async (id) => {
  const p = allProducts[id];
  if(!p) return;
  const code = document.getElementById("unlockCode").value.trim();
  const res = document.getElementById("unlockResult");
  if(!code){ res.innerHTML = `<div style="color:var(--danger);font-size:12.5px;margin-top:10px;text-align:center">ادخل الكود</div>`; return; }
  if(code !== (p.access?.code || "")){
    res.innerHTML = `<div style="color:var(--danger);font-size:12.5px;margin-top:10px;text-align:center">❌ كود غير صحيح</div>`;
    return;
  }
  res.innerHTML = `<div class="unlocked-content"><div class="lbl">✅ تم فتح المنتج</div>${renderOpenContent(p.content || {})}</div>`;
};

window.requestPurchase = async (id) => {
  const p = allProducts[id];
  if(!p) return;
  const sel = document.getElementById("payCurrency");
  let currency = null, amount = null;
  if(sel){
    const parts = sel.value.split("|");
    currency = parts[0]; amount = parts[1];
  }
  const orderNumber = "ORD-" + Date.now().toString().slice(-6) + "-" + uid8();
  const order = {
    orderNumber,
    productId: id,
    productName: p.name,
    productCover: p.coverUrl || null,
    buyerUid: me.uid,
    buyerName: me.name,
    buyerEmail: me.email,
    sellerUid: p.from?.uid || null,
    sellerName: p.from?.name || null,
    currency, amount,
    paid: 0,
    remaining: amount,
    status: "pending",
    createdAt: Date.now()
  };
  await push(ref(db,"orders"), order);
  toast("تم إرسال طلبك ✅");
  closeProduct();
};

window.submitProduct = async () => {
  const status = document.getElementById("apStatus");
  status.className = "auth-msg err";
  const name = document.getElementById("apName").value.trim();
  if(!name){ status.textContent = "اكتب اسم المنتج"; return; }

  const accessType = document.querySelector('input[name="apAccess"]:checked').value;
  const desc = document.getElementById("apDesc").value.trim();
  const catId = document.getElementById("apCat").value;
  const contentType = document.getElementById("apContentType").value;
  const contentUrl = document.getElementById("apContentUrl").value.trim();
  const contentFile = document.getElementById("apContentFile").files[0];
  const coverFile = document.getElementById("apCover").files[0];

  status.className = "auth-msg"; status.textContent = "جاري الرفع...";

  try{
    let coverUrl = null;
    if(coverFile){
      const r = await uploadImage(coverFile);
      coverUrl = r.url;
    }
    let content = { type: contentType };
    if(contentType === "file"){
      if(!contentFile) throw new Error("اختر ملف");
      const r = await uploadFile(contentFile);
      content.url = r.url;
      content.fileName = r.name;
    } else {
      if(!contentUrl) throw new Error("الصق الرابط");
      content.url = contentUrl;
    }

    const prices = [];
    document.querySelectorAll("#pricesList .price-item").forEach(row => {
      const currency = row.querySelector("select").value;
      const amount = row.querySelector("input").value.trim();
      if(amount) prices.push({ currency, amount });
    });

    const access = { type: accessType };
    if(accessType === "code"){
      access.code = (document.getElementById("apCode")?.value || "").trim();
      access.hintLink = (document.getElementById("apHintLink")?.value || "").trim();
      access.purchaseCodeAllowed = !!document.getElementById("apAllowPurchase")?.checked;
    }

    const audType = document.getElementById("apAudience").value;
    const audience = { type: audType };
    if(audType === "role"){
      audience.roles = [...document.querySelectorAll("#audienceExtra input[type=checkbox]:checked")].map(c => c.value);
    } else if(audType === "user" || audType === "dev"){
      audience.uids = [...document.querySelectorAll(".aud-user:checked")].map(c => c.dataset.uid);
    }

    const product = {
      name, description: desc,
      categoryId: catId || null,
      coverUrl,
      content,
      access,
      audience,
      prices,
      from: { uid: me.uid, name: me.name, email: me.email, role: me.role, isOwner: me.isOwner },
      createdAt: Date.now()
    };
    await push(ref(db,"products"), product);
    status.className = "auth-msg ok"; status.textContent = "✅ تم النشر";
    toast("تم نشر المنتج");
    setTimeout(() => setTab("products"), 800);
  }catch(e){
    status.className = "auth-msg err"; status.textContent = "فشل: " + e.message;
  }
};

    </div>

      ${cats.length ? cats.map(([id,c]) => `
        <div class="perm-row" style="cursor:default">

};

window.addCategory = async () => {
  const name = document.getElementById("newCatName").value.trim();
  if(!name) return toast("اكتب اسم الفئة", true);
  const count = Object.keys(allCategories).length;
  await push(ref(db,"categories"), { name, order: count, createdAt: Date.now() });
  await loadCategories();
  toast("تمت إضافة الفئة");
  openCatManager();
};

window.deleteCategory = async (id) => {
  if(!confirm("حذف الفئة؟")) return;
  await remove(ref(db,"categories/"+id));
  await loadCategories();
  toast("تم الحذف");

async function sendPost(category, { textId, imgId, fileId, statusId }){
  const text = document.getElementById(textId).value.trim();
  const imgEl = document.getElementById(imgId), fileEl = document.getElementById(fileId);
  const status = document.getElementById(statusId);
  const imgFile = imgEl.files[0], fileFile = fileEl.files[0];
  if(!text && !imgFile && !fileFile){
    status.className = "auth-msg err"; status.textContent = "اكتب رسالة أو اختر ملف";
    return;
  }
  status.className = "auth-msg"; status.textContent = "جاري الإرسال...";
  let image=null, fileData=null;
  try{
    if(imgFile) image = await uploadImage(imgFile);
    if(fileFile) fileData = await uploadFile(fileFile);
  }catch(e){
    status.className = "auth-msg err"; status.textContent = "فشل الرفع: " + e.message; return;
  }
  await push(ref(db,"feed"), {
    category, text, image, file:fileData,
    from: { uid: me.uid, name: me.name, email: me.email, role: me.role, isOwner: me.isOwner },
    createdAt: Date.now()
  });
  document.getElementById(textId).value = "";
  imgEl.value = ""; fileEl.value = "";
  status.className = "auth-msg ok"; status.textContent = "تم الإرسال";
  toast("تم النشر");
  setTimeout(()=>{ status.textContent = ""; }, 2000);
}
function bindComposerAttach(id){
  const imgEl = document.getElementById(id+"_img");
  const fileEl = document.getElementById(id+"_file");
  if(imgEl) imgEl.onchange = () => document.getElementById(id+"_imgLbl").style.color = imgEl.files[0] ? "var(--neon)" : "";
  if(fileEl) fileEl.onchange = () => document.getElementById(id+"_fileLbl").style.color = fileEl.files[0] ? "var(--neon)" : "";
}

function postHTML(p){
  const r = roleInfo(p.from);
  const canDel = me.isOwner || hasPerm(me,"deleteAnyPost") || p.from?.uid === me.uid;
  const canEdit = p.from?.uid === me.uid;
  const avClass = p.from?.isOwner ? "owner" : (r.cls === "admin" ? "admin" : "");
  return `
    <div class="post" data-key="${p.key}">
      <div class="post-head">
        <div class="av ${avClass}">${esc(initial(p.from?.name))}</div>
        <div class="meta">
          <div class="name">${esc(p.from?.name || "؟")} ${roleBadge(p.from)}</div>
          <div class="info">${fmtTime(p.createdAt)}</div>
        </div>
      </div>
      ${p.text ? `<div class="body" data-body>${esc(p.text)}</div>` : ""}
      ${p.image ? `<img class="attach-img" src="${esc(p.image.url)}" />` : ""}
      ${p.file ? `<a class="attach-file" href="${esc(p.file.url)}" target="_blank" rel="noopener">📎 ${esc(p.file.name)} · ${(p.file.size/1024).toFixed(0)} KB</a>` : ""}
      ${(canEdit || canDel) ? `
        <div class="post-actions">
          ${canEdit ? `<button class="edit" data-edit>✏️ تعديل</button>` : ""}

function bindPostActions(container){
  container.querySelectorAll("img.attach-img").forEach(img => {
    img.onclick = () => {
      document.getElementById("lightImg").src = img.src;
      document.getElementById("lightbox").classList.add("open");
    };
  });
  container.querySelectorAll(".post").forEach(post => {
    const key = post.dataset.key;
    const delBtn = post.querySelector("[data-del]");
    const editBtn = post.querySelector("[data-edit]");
    if(delBtn) delBtn.onclick = async () => {
      if(!confirm("حذف المنشور؟")) return;
      await remove(ref(db,"feed/"+key));
      toast("تم الحذف");
    };
    if(editBtn) editBtn.onclick = () => {
      const body = post.querySelector("[data-body]");
      if(!body) return;
      if(editingPostKey === key){
        update(ref(db,"feed/"+key), { text: body.textContent.trim() }).then(()=>{ toast("تم التعديل"); editingPostKey = null; });
      } else {
        editingPostKey = key;
        body.setAttribute("contenteditable","true");
        body.style.outline = "1px dashed var(--neon)";
        body.style.padding = "10px";
        body.style.borderRadius = "8px";
        body.focus();
        editBtn.textContent = "💾 حفظ";
      }
    };
  });
}

async function renderSupport(){
  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="page-head">

      <p>تواصل مباشر مع المطوّر أو فريق الدعم.</p>

      </div>
    </div>
  `;

  const side = document.getElementById("chatSide");
  const contacts = [];

  if(me.isOwner){
    Object.values(allUsers).forEach(u => { if(u.uid !== me.uid) contacts.push(u); });
  } else {
    const lastSnap = await get(ref(db,"chatsByUser/"+me.uid));
    const existing = {};
    if(lastSnap.exists()) lastSnap.forEach(ch => existing[ch.key] = true);

    Object.values(allUsers).forEach(u => {
      if(u.uid === me.uid) return;
      const isOwnerUser = u.role === "owner" || isOwner(u.email);
      const canReceive = isOwnerUser || (u.perms && u.perms.receiveUserMsgs);
      if(canReceive || existing[u.uid]) contacts.push(u);
    });
  }

  if(!contacts.length){
    side.innerHTML = `<div class="empty-state"><div class="big">💬</div>لا توجد محادثات متاحة</div>`;
    return;
  }

  const lastSnap = await get(ref(db,"chatsByUser/"+me.uid));
  const lastMap = {};
  if(lastSnap.exists()) lastSnap.forEach(ch => lastMap[ch.key] = ch.val());
  contacts.sort((a,b) => (lastMap[b.uid]?.lastAt||0) - (lastMap[a.uid]?.lastAt||0));

  side.innerHTML = `<h4>جهات الاتصال</h4>` + contacts.map(u => {
    const r = roleInfo(u);
    const avClass = (u.isOwner || u.role === "owner") ? "owner" : (r.cls === "admin" ? "admin" : "");
    const last = lastMap[u.uid]?.lastText || "لا توجد رسائل";
    const lastAt = lastMap[u.uid]?.lastAt ? fmtTime(lastMap[u.uid].lastAt) : "";
    const online = isOnline(u);
    return `
      <div class="chat-contact" data-uid="${u.uid}" onclick="openChat('${u.uid}')">
        <div class="av ${avClass}">${esc(initial(u.name))}<div class="dot ${online?"online":""}"></div></div>
        <div class="info">
          <div class="n">${esc(u.name)} ${r.icon}</div>
          <div class="p">${esc(last)}</div>
        </div>
        <div class="time">${lastAt}</div>
      </div>`;
  }).join("");
}

window.openChat = async uid => {
  activeChatUid = uid;
  document.querySelectorAll(".chat-contact").forEach(el => el.classList.toggle("active", el.dataset.uid===uid));
  const target = allUsers[uid];
  if(!target) return;
  const r = roleInfo(target);
  const targetIsOwner = target.isOwner || target.role === "owner" || isOwner(target.email);
  const canSend = me.isOwner || hasPerm(me,"replyChats") || targetIsOwner;
  const avClass = targetIsOwner ? "owner" : (r.cls === "admin" ? "admin" : "");
  const online = isOnline(target);

  const room = document.getElementById("chatRoom");
  room.innerHTML = `
    <div class="chat-header">
      <div class="av ${avClass}">${esc(initial(target.name))}<div class="dot ${online?"online":""}"></div></div>
      <div class="who">
        <h3>${esc(target.name)} ${roleBadge({...target, isOwner: targetIsOwner})}</h3>
        <span>${statusText(target)}</span>
      </div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    ${canSend ? `
    <div class="chat-compose">
      <label class="icon-btn" id="ci_imgLbl">🖼️<input type="file" accept="image/*" id="ci_img" /></label>
      <label class="icon-btn" id="ci_fileLbl">📎<input type="file" id="ci_file" /></label>
      <textarea id="ci_text" placeholder="اكتب رسالة..." rows="1"></textarea>
      <button class="icon-btn send" id="ci_send">➤</button>
    </div>` : ``}
  `;

  if(canSend){
    const imgEl = document.getElementById("ci_img");
    const fileEl = document.getElementById("ci_file");
    imgEl.onchange = () => document.getElementById("ci_imgLbl").style.color = imgEl.files[0] ? "var(--neon)" : "";
    fileEl.onchange = () => document.getElementById("ci_fileLbl").style.color = fileEl.files[0] ? "var(--neon)" : "";
    document.getElementById("ci_send").onclick = () => sendChat(target);
    const tEl = document.getElementById("ci_text");
    tEl.addEventListener("keydown", e => {
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(target); }
    });
    tEl.addEventListener("input", () => {
      tEl.style.height = "auto";
      tEl.style.height = Math.min(tEl.scrollHeight, 130) + "px";
    });
  }

  if(unsubChatRoom){ unsubChatRoom(); unsubChatRoom=null; }
  const key = chatKey(me.uid, uid);
  unsubChatRoom = onValue(ref(db,"chats/"+key+"/messages"), snap => {
    const body = document.getElementById("chatBody");
    if(!snap.exists()){
      body.innerHTML = `<div class="empty-chat"><div><div class="big">✨</div>لا توجد رسائل — ابدأ الحديث</div></div>`;
      return;
    }
    const msgs = [];
    snap.forEach(ch => msgs.push({ key: ch.key, ...ch.val() }));
    msgs.sort((a,b)=>a.createdAt-b.createdAt);
    body.innerHTML = msgs.map(m => bubbleHTML(m,key)).join("");
    body.scrollTop = body.scrollHeight;
    body.querySelectorAll("img").forEach(img => {
      img.onclick = () => {
        document.getElementById("lightImg").src = img.src;
        document.getElementById("lightbox").classList.add("open");
      };
    });
    body.querySelectorAll("[data-delmsg]").forEach(b => {
      b.onclick = async () => {
        if(!confirm("حذف الرسالة؟")) return;
        await remove(ref(db,"chats/"+key+"/messages/"+b.dataset.delmsg));
      };
    });
    body.querySelectorAll("[data-editmsg]").forEach(b => {
      b.onclick = () => startEditMsg(key, b.dataset.editmsg);
    });
  });
};

function bubbleHTML(m, chatKeyStr){

  return `
    <div class="bubble ${mine ? "mine" : "theirs"}">

async function startEditMsg(chatKeyStr, msgKey){
  const cur = prompt("عدّل الرسالة:");
  if(cur === null) return;
  await update(ref(db,"chats/"+chatKeyStr+"/messages/"+msgKey), { text: cur.trim() });
  toast("تم التعديل");
}

async function sendChat(target){
  const textEl = document.getElementById("ci_text");
  const imgEl = document.getElementById("ci_img");
  const fileEl = document.getElementById("ci_file");
  const text = textEl.value.trim();
  const imgFile = imgEl.files[0], fileFile = fileEl.files[0];
  if(!text && !imgFile && !fileFile) return;

  let image=null, fileData=null;
  try{
    if(imgFile) image = await uploadImage(imgFile);
    if(fileFile) fileData = await uploadFile(fileFile);
  }catch(e){ toast("فشل الرفع: "+e.message, true); return; }

  const key = chatKey(me.uid, target.uid);
  const msg = {
    text, image, file:fileData,
    from:{ uid: me.uid, name: me.name, email: me.email, role: me.role, isOwner: me.isOwner },
    createdAt: Date.now()
  };
  await push(ref(db,"chats/"+key+"/messages"), msg);

  const preview = text || (image ? "[صورة]" : "[ملف]");
  await update(ref(db,"chatsByUser/"+me.uid+"/"+target.uid), { lastText: preview, lastAt: Date.now(), otherUid: target.uid });
  await update(ref(db,"chatsByUser/"+target.uid+"/"+me.uid), { lastText: preview, lastAt: Date.now(), otherUid: me.uid });

  textEl.value = ""; imgEl.value = ""; fileEl.value = "";
  document.getElementById("ci_imgLbl").style.color = "";
  document.getElementById("ci_fileLbl").style.color = "";
  textEl.style.height = "auto";
}

};
window.quickPay = async id => {
  const o = allOrders[id];
  if(!o) return;
  await update(ref(db,"orders/"+id), { paid: o.amount, remaining: 0, status: "paid", reviewedAt: Date.now(), reviewedBy: me.name });
  toast("تم تأكيد الدفع ✅");
};
window.quickReject = async id => {
  if(!confirm("رفض الطلب؟")) return;
  await update(ref(db,"orders/"+id), { status: "rejected", reviewedAt: Date.now(), reviewedBy: me.name });
  toast("تم الرفض");
};

/* ========== ADMIN ========== */
async function renderAdmin(){
  const c = document.getElementById("content");
  if(!(me.isOwner || hasPerm(me,"manageUsers"))){
    c.innerHTML = `<div class="empty-state"><div class="big">🚫</div>لا تملك صلاحية الإدارة</div>`;
    return;
  }
  c.innerHTML = `
    <div class="page-head">
      <h2>🛡️ الإدارة</h2>
      <p>إدارة الأعضاء والصلاحيات ومتابعة الحالة. القائمة تتحدث لحظياً.</p>
    </div>
    <div class="user-list" id="userList"></div>
  `;
  const list = document.getElementById("userList");
  const users = Object.values(allUsers);
  users.sort((a,b) => {
    const order = { owner:0, admin:1, dev:2, user:3 };
    const oa = order[a.role] ?? 9, ob = order[b.role] ?? 9;
    if(oa !== ob) return oa - ob;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  if(!users.length){ list.innerHTML = emptyState("لا يوجد أعضاء"); return; }
  list.innerHTML = users.map(u => {
    const r = roleInfo(u);
    const avClass = u.isOwner ? "owner" : (r.cls === "admin" ? "admin" : "");
    const permCount = u.isOwner ? PERMS.length : Object.values(u.perms||{}).filter(Boolean).length;
    const online = isOnline(u);
    const status = statusText(u);
    const firstSeen = u.createdAt ? fmtDate(u.createdAt) : "—";
    const lastSeenTxt = u.lastSeen ? fmtDate(u.lastSeen) : "—";
    const canEdit = me.isOwner || hasPerm(me,"manageUsers");
    return `
      <div class="user-item">
        <div class="av ${avClass}">${esc(initial(u.name))}<div class="dot ${online?"online":""}"></div></div>
        <div class="u-info">
          <div class="n">${esc(u.name)} ${roleBadge(u)} ${online ? `<span style="font-size:10.5px;color:var(--neon);font-weight:700">🟢 متصل</span>` : ""}</div>
          <div class="e">${esc(u.email)}</div>
          <div class="last-seen">${status} · ${permCount} صلاحية</div>
          <div class="last-seen" style="font-size:10px">أول دخول: ${firstSeen} · آخر نبضة: ${lastSeenTxt}</div>
        </div>
        <div class="acts">
          ${canEdit ? `<button class="btn ghost small" onclick="openPermModal('${u.uid}')">⚙️ الصلاحيات</button>` : ""}
          ${(me.isOwner && u.uid !== me.uid && !u.isOwner) ? `<button class="btn danger small" onclick="deleteUser('${u.uid}')">🗑</button>` : ""}
        </div>
      </div>`;
  }).join("");
}

window.deleteUser = async uid => {
  if(!confirm("حذف المستخدم من قاعدة البيانات؟ (الحساب في Auth يحتاج حذف يدوي)")) return;
  try {
    await remove(ref(db,"users/"+uid));
    toast("تم الحذف من قاعدة البيانات");
  } catch(e){ toast("فشل: "+e.message, true); }
};

window.openPermModal = async uid => {
  permTargetUid = uid;
  const u = allUsers[uid];
  if(!u) return;
  document.getElementById("pmTitle").textContent = "صلاحيات: " + u.name;
  document.getElementById("pmSub").textContent = u.email;

  let body = `
    <div class="field">
      <label>الرتبة الأساسية</label>
      <select id="pmRole">
        <option value="user"  ${u.role==="user"?"selected":""}>عضو</option>
        <option value="admin" ${u.role==="admin"?"selected":""}>أدمن</option>
        <option value="dev"   ${u.role==="dev"?"selected":""}>مطوّر مساعد</option>
      </select>
    </div>
    <div style="margin:18px 0 10px;font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700">الصلاحيات التفصيلية</div>
  `;
  PERMS.forEach(p => {
    const checked = u.perms?.[p.key] ? "checked" : "";
    body += `
      <label class="perm-row">
        <input type="checkbox" data-perm="${p.key}" ${checked} />
        <div class="ptxt"><b>${p.label}</b><small>${p.desc}</small></div>
      </label>`;
  });
  document.getElementById("pmBody").innerHTML = body;
  document.getElementById("pmActions").style.display = "";
  document.getElementById("permModal").classList.add("open");
};

window.closePermModal = () => {
  document.getElementById("permModal").classList.remove("open");
  permTargetUid = null;
};

window.savePerms = async () => {
  if(!permTargetUid) return;
  const role = document.getElementById("pmRole").value;
  const perms = {};
  document.querySelectorAll("#pmBody input[data-perm]").forEach(cb => {
    perms[cb.dataset.perm] = cb.checked;
  });
  await update(ref(db,"users/"+permTargetUid), { role, perms });
  toast("تم حفظ الصلاحيات");
  closePermModal();
};

/* ========== PROFILE ========== */
function renderProfile(){
  const c = document.getElementById("content");
  const r = roleInfo(me);
  const permList = me.isOwner ? PERMS.map(p=>p.label) : PERMS.filter(p=>me.perms?.[p.key]).map(p=>p.label);
  c.innerHTML = `
    <div class="page-head">
      <h2>👤 حسابي</h2>
      <p>بيانات حسابك الأساسية.</p>
    </div>
    <div style="max-width:560px;background:rgba(3,5,3,.5);border:1px solid var(--line);border-radius:12px;padding:18px">
      <div class="field"><label>الاسم الظاهر</label><input id="pName" value="${esc(me.name)}" /></div>
      <div class="field"><label>البريد الإلكتروني</label><input value="${esc(me.email)}" disabled /></div>
      <div class="field"><label>الرتبة</label><input value="${r.icon} ${r.label}" disabled /></div>
      <div class="field"><label>الحالة</label><input value="🟢 متصل الآن" disabled /></div>
      <div class="field">
        <label>الصلاحيات المُفعّلة</label>
        <div style="font-size:13px;color:var(--muted);padding:12px;background:rgba(3,5,3,.5);border:1px solid var(--line);border-radius:10px;line-height:1.9">
          ${permList.length ? permList.map(esc).join(" · ") : "لا توجد صلاحيات خاصة"}
        </div>
      </div>
      <button class="btn" id="pSave" style="margin-top:8px">حفظ التعديلات</button>
    </div>
  `;
  document.getElementById("pSave").onclick = async () => {
    const name = document.getElementById("pName").value.trim();
    if(!name) return toast("اكتب اسم صحيح", true);
    await update(ref(db,"users/"+me.uid), { name });
    me.name = name;
    document.getElementById("meName").textContent = name;
    document.getElementById("meAv").firstChild.nodeValue = initial(name);
    toast("تم الحفظ");
  };
}

function emptyState(msg){
  return `<div class="empty-state"><div class="big">📭</div>${esc(msg)}</div>`;
}

document.getElementById("productModal").addEventListener("click", e => {
  if(e.target.id === "productModal") closeProduct();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    closeProduct();
    closePermModal();
    closeOrderReview();
  }
});
</script>
</body>
